name: Build & Release Master Nerd EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./master
        run: npm ci

      - name: Build EXE (electron-builder)
        working-directory: ./master
        run: npm run build

      - name: List dist files
        run: Get-ChildItem -Recurse master/dist | Format-Table -AutoSize

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            master/dist/**/Master Nerd.exe
            master/dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterNerd-build
          path: |
            master/dist/**/Master Nerd.exe
            master/dist/*.exe
